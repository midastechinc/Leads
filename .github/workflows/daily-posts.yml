name: Daily Social Post Generator

on:
  # The daily schedule is turned off: posts are now planned as campaigns in
  # the Social Posts calendar. To bring it back, restore:
  #   schedule:
  #     - cron: '30 14 * * *'
  workflow_dispatch:
    # Can still be run by hand from the GitHub Actions tab

jobs:
  generate-posts:
    name: Generate & Save Daily Posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Generate daily posts
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ONEMIN_API_KEY:    ${{ secrets.ONEMIN_API_KEY }}
        run: node generate-posts.mjs
        working-directory: scripts
